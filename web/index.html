<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Arbitrage Engine Live</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="dashboard">
        <header class="glass-header">
            <div class="logo">Crypto <span class="neon-text">Arbitrage</span> Dashboard</div>
            <div id="market-indices" class="market-indices"></div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button id="toggle-scanner-btn" onclick="toggleScanner()" class="nav-btn" style="background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.5); color: var(--neon-blue); cursor: pointer;">Pause Scanner</button>
                <div class="status-indicator" id="scanner-status">
                    Scanner Running <div class="pulse-dot" id="scanner-pulse"></div>
                </div>
            </div>
        </header>

        <div style="display: flex; gap: 2rem; margin-bottom: 2rem;">
            <div class="glass-panel" style="flex: 1; height: auto; padding: 1rem 2rem;">
                <div style="display: flex; justify-content: space-around; font-weight: bold; color: var(--neon-blue);">
                    <div>Triangular: <span id="count-triangular" style="color: var(--text-primary);">0</span></div>
                    <div>Cross-Broker/Spatial: <span id="count-cross" style="color: var(--text-primary);">0</span></div>
                    <div>Statistical: <span id="count-stat" style="color: var(--text-primary);">0</span></div>
                    <div>Funding Rate: <span id="count-funding" style="color: var(--text-primary);">0</span></div>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 2rem; margin-bottom: 2rem;">
            <div class="glass-panel" style="flex: 2; height: 400px; padding: 1rem; position: relative;">
                <h3 style="text-align: center; margin-top: 0; margin-bottom: 0.5rem; color: var(--text-secondary); font-size: 1rem;">Real-Time Arbitrage Graph</h3>
                <div id="network-graph" style="width: 100%; height: calc(100% - 30px);"></div>
            </div>
            <div class="glass-panel" style="flex: 1; height: 400px; padding: 1rem; position: relative; overflow-y: auto;">
                <h3 style="text-align: center; margin-top: 0; margin-bottom: 0.5rem; color: var(--neon-purple); font-size: 1rem; text-shadow: 0 0 5px rgba(139, 92, 246, 0.3);">Real-Time Market AI</h3>
                <div id="predictions-container" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem;">
                    <!-- Injected via JS -->
                </div>
            </div>
        </div>

        <div class="grid-layout">
            <div class="glass-panel">
                <h2>Live Opportunities Found</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Arbitrage Path</th>
                                <th>Gross Profit %</th>
                                <th>Net Profit %</th>
                                <th>Expected ROI %</th>
                                <th>Est. PnL (USDT)</th>
                            </tr>
                        </thead>
                        <tbody id="opp-list">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="glass-panel">
                <h2>Execution Console</h2>
                <div id="log-console" class="console">
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
